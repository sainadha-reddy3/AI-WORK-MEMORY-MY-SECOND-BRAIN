services:
  backend:
    build: ./backend
    container_name: awm-backend
    ports:
      - "8000:8000"
    volumes:
      # Live-reload: your local code is mapped into the container,
      # so edits appear instantly without rebuilding the image.
      - ./backend/app:/app/app
      # Uploaded files live on the host, NOT inside the container,
      # so they survive the container being destroyed.
      - ./storage:/app/storage
    environment:
      - ENVIRONMENT=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped