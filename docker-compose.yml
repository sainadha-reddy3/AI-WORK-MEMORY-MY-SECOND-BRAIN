services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: awm-postgres
    # Kept for now as a local fallback while the app moves to Neon.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - awm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: awm-backend
    # Shares the Codespace's network stack directly.
    # Workaround for broken container-to-container forwarding here.
    network_mode: host
    volumes:
      # Map the WHOLE backend folder, not just app/, so files the
      # container creates (alembic migrations) land in the repo.
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      # Permanent hosted database (Neon), read from .env.
      # To fall back to the local container, use this line instead:
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
      - DATABASE_URL=${NEON_DATABASE_URL}
      # File storage: "local" folder or "s3" (Neon Object Storage).
      # Defaults to local until STORAGE_BACKEND is set in .env.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION}
      # AI provider config. Swapping providers is a config change,
      # never a code change.
      - AI_PROVIDER=${AI_PROVIDER}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  awm_postgres_data: