services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: awm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - awm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: awm-backend
    # Shares the Codespace's network stack directly.
    # Workaround for broken container-to-container forwarding here.
    network_mode: host
    volumes:
      # Map the WHOLE backend folder, not just app/, so files the
      # container creates (alembic migrations) land in the repo.
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      # localhost = the Codespace itself, where postgres publishes 5432.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  awm_postgres_data: