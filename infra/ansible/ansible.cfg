# Ansible settings for this folder. Ansible reads ansible.cfg from the
# directory you run it in.

[defaults]
inventory = inventory.ini
roles_path = roles
# Readable, step-by-step output.
stdout_callback = default
# Don't try to SSH-check host keys — we only manage localhost.
host_key_checking = False
# Quieter: don't warn about the Python interpreter choice.
interpreter_python = auto_silent